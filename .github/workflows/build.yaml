name: OS Build CI

on:
  push:
    branches: [ "main", "new" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code I Guess
      uses: actions/checkout@v4.1.7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld nasm mtools exfatprogs

    - name: Compile OS
      run: python3 compile.py

    - name: Upload Disk Image
      uses: actions/upload-artifact@v4
      with:
        name: windoge-os-image
        path: |
          *.img
          *.iso
          *.bin
